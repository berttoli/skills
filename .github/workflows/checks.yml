name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Test installer behavior
        run: bash tests/test_install.sh

      - name: Check installer syntax
        run: bash -n install.sh

      - name: Apply installer to a temporary home
        run: |
          trial_home="$(mktemp -d)"
          trap 'rm -rf "$trial_home"' EXIT
          ./install.sh --home "$trial_home" --apply

      - name: Test retro digest
        run: python3 -I skills/retro/scripts/test_retro_digest.py
